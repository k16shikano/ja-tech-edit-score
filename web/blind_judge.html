<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ブラインド判定</title>
  <style>
    :root {
      --bg: #f7f5f0;
      --ink: #1c1b19;
      --muted: #5c574e;
      --line: #d9d2c4;
      --card: #fffefb;
      --accent: #2f5d50;
      --warn: #8a4b2e;
      --del-bg: #f8d7da;
      --del-ink: #842029;
      --ins-bg: #d1e7dd;
      --ins-ink: #0f5132;
      --eq-ink: #8a857c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.65;
    }
    header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--line);
      background: var(--card);
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: baseline;
      flex-wrap: wrap;
    }
    h1 { font-size: 1.1rem; margin: 0; font-weight: 650; }
    #progress { color: var(--muted); font-size: 0.95rem; }
    main { max-width: 1100px; margin: 0 auto; padding: 1.25rem; }
    .label {
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin: 0 0 0.35rem;
      text-transform: none;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 1rem 1.1rem;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.98rem;
      max-height: 42vh;
      overflow: auto;
    }
    .panel.diff-view {
      white-space: normal;
      font-size: 0.92rem;
      line-height: 1.55;
    }
    .diff-line {
      display: block;
      padding: 0.12rem 0.35rem;
      border-radius: 3px;
      margin: 0.08rem 0;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .diff-gutter {
      display: inline-block;
      width: 1.4em;
      flex-shrink: 0;
      user-select: none;
      font-weight: 700;
      font-family: ui-monospace, monospace;
    }
    .diff-line.diff-eq { color: var(--eq-ink); }
    .diff-line.draft-line { color: var(--ink); }
    .diff-line.diff-del-line { background: var(--del-bg); }
    .diff-line.diff-ins-line { background: var(--ins-bg); }
    .diff-line.diff-chg { background: #fff8e6; border-left: 3px solid #c9a227; }
    .diff-del {
      background: var(--del-bg);
      color: var(--del-ink);
      text-decoration: line-through;
      text-decoration-color: rgba(132, 32, 41, 0.55);
    }
    .diff-ins {
      background: var(--ins-bg);
      color: var(--ins-ink);
      font-weight: 600;
    }
    .diff-skip {
      color: var(--muted);
      font-size: 0.85rem;
      padding: 0.35rem 0.35rem;
      text-align: center;
      border-top: 1px dashed var(--line);
      border-bottom: 1px dashed var(--line);
      margin: 0.25rem 0;
    }
    .diff-empty {
      color: var(--muted);
      font-style: italic;
      margin: 0;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 1rem;
    }
    @media (max-width: 860px) {
      .grid { grid-template-columns: 1fr; }
    }
    .view-toggle {
      display: inline-flex;
      gap: 0.25rem;
    }
    .view-toggle button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
      border-radius: 4px;
      padding: 0.15rem 0.45rem;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .view-toggle button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .legend {
      font-size: 0.8rem;
      color: var(--muted);
      margin: 0.5rem 0 0;
    }
    .legend span { margin-right: 1rem; }
    .legend .sw-del { color: var(--del-ink); }
    .legend .sw-ins { color: var(--ins-ink); }
    .actions {
      margin-top: 1.25rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: center;
    }
    button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 6px;
      padding: 0.65rem 1rem;
      font-size: 1rem;
      cursor: pointer;
    }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    textarea {
      width: 100%;
      min-height: 4rem;
      margin-top: 0.75rem;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0.6rem 0.7rem;
      font: inherit;
      background: var(--card);
    }
    #done-msg {
      display: none;
      margin-top: 2rem;
      padding: 1.25rem;
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 6px;
    }
    #err {
      color: var(--warn);
      margin: 0.75rem 0 0;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <header>
    <h1>ブラインド判定（出所は表示しない）</h1>
    <div id="progress">読込中…</div>
    <div id="ui-ver" style="font-size:0.75rem;color:#8a857c">UI v7</div>
  </header>
  <main>
    <div id="judge-view">
      <p class="label">文脈（下書き）</p>
      <div class="panel" id="draft"></div>
      <p class="legend">
        <span class="sw-del">− 削除</span>
        <span class="sw-ins">＋ 追加</span>
        <span class="sw-ins">± 行内変更（赤=削除・緑=追加）</span>
        候補は全文表示。変更行だけ色付け（下書きと同一なら通常表示）。
      </p>
      <div class="grid">
        <div>
          <p class="label">
            <span>候補 A</span>
            <span class="view-toggle" data-side="a">
              <button type="button" data-mode="diff" class="active">差分</button>
              <button type="button" data-mode="full">全文</button>
            </span>
          </p>
          <div class="panel diff-view" id="a"></div>
        </div>
        <div>
          <p class="label">
            <span>候補 B</span>
            <span class="view-toggle" data-side="b">
              <button type="button" data-mode="diff" class="active">差分</button>
              <button type="button" data-mode="full">全文</button>
            </span>
          </p>
          <div class="panel diff-view" id="b"></div>
        </div>
      </div>
      <div style="margin-top:1rem;display:grid;grid-template-columns:1fr 1fr;gap:.4rem 1.5rem">
        <label><input type="checkbox" id="flag-a"> A に致命的な欠落・破壊がある</label>
        <label><input type="checkbox" id="flag-b"> B に致命的な欠落・破壊がある</label>
        <label><input type="checkbox" id="noedit-a"> A は下書きとの事実上の差分なし</label>
        <label><input type="checkbox" id="noedit-b"> B は下書きとの事実上の差分なし</label>
      </div>
      <label class="label" for="comment" style="display:block;margin-top:1rem">コメント（任意）</label>
      <textarea id="comment" placeholder="気になった点があれば"></textarea>
      <div class="actions">
        <button class="primary" id="btn-a">A のほうがまし</button>
        <button class="primary" id="btn-b">B のほうがまし</button>
        <button id="btn-tie">同等</button>
      </div>
      <p id="err"></p>
    </div>
    <div id="done-msg">判定はすべて完了しました。ありがとうございます。</div>
  </main>
  <script>
    let currentPairId = null;
    let currentA = "";
    let currentB = "";
    let currentADiffHtml = "";
    let currentBDiffHtml = "";
    const viewMode = { a: "diff", b: "diff" };

    const draftEl = document.getElementById("draft");
    const aEl = document.getElementById("a");
    const bEl = document.getElementById("b");
    const progressEl = document.getElementById("progress");
    const errEl = document.getElementById("err");
    const commentEl = document.getElementById("comment");
    const judgeView = document.getElementById("judge-view");
    const doneMsg = document.getElementById("done-msg");

    const syncPanels = [aEl, bEl];
    let scrollSyncLock = false;

    function renderLinePanel(el, text) {
      el.classList.add("diff-view");
      el.innerHTML = "";
      for (const line of (text || "").split("\n")) {
        const div = document.createElement("div");
        div.className = "diff-line draft-line";
        div.textContent = line || " ";
        el.appendChild(div);
      }
    }

    function getScrollRatio(el) {
      const max = el.scrollHeight - el.clientHeight;
      return max > 0 ? el.scrollTop / max : 0;
    }

    function setScrollRatio(el, ratio) {
      const max = el.scrollHeight - el.clientHeight;
      el.scrollTop = ratio * max;
    }

    function syncScrollFrom(source) {
      if (scrollSyncLock) return;
      scrollSyncLock = true;
      const ratio = getScrollRatio(source);
      for (const target of syncPanels) {
        if (target !== source) setScrollRatio(target, ratio);
      }
      scrollSyncLock = false;
    }

    function resetCandidateScroll() {
      scrollSyncLock = true;
      aEl.scrollTop = 0;
      bEl.scrollTop = 0;
      scrollSyncLock = false;
    }

    function renderCandidate(el, fullText, diffHtml, mode) {
      if (mode === "full") {
        renderLinePanel(el, fullText || "");
      } else if (diffHtml) {
        el.classList.add("diff-view");
        el.innerHTML = diffHtml;
      } else {
        renderLinePanel(el, fullText || "");
      }
    }

    function renderDraft(text) {
      draftEl.classList.remove("diff-view");
      draftEl.textContent = text || "";
    }

    function refreshCandidates() {
      renderCandidate(aEl, currentA, currentADiffHtml, viewMode.a);
      renderCandidate(bEl, currentB, currentBDiffHtml, viewMode.b);
    }

    function setViewMode(side, mode) {
      viewMode[side] = mode;
      const toggle = document.querySelector(`.view-toggle[data-side="${side}"]`);
      for (const btn of toggle.querySelectorAll("button")) {
        btn.classList.toggle("active", btn.dataset.mode === mode);
      }
      refreshCandidates();
    }

    async function refreshStatus() {
      const res = await fetch("/api/status");
      const st = await res.json();
      progressEl.textContent =
        `残り ${st.remaining} / 全 ${st.total}（完了 ${st.done}）`;
    }

    async function loadNext() {
      errEl.textContent = "";
      commentEl.value = "";
      for (const id of ["flag-a", "flag-b", "noedit-a", "noedit-b"]) {
        document.getElementById(id).checked = false;
      }
      await refreshStatus();
      const res = await fetch("/api/next");
      const data = await res.json();
      if (data.done) {
        judgeView.style.display = "none";
        doneMsg.style.display = "block";
        currentPairId = null;
        return;
      }
      judgeView.style.display = "block";
      doneMsg.style.display = "none";
      currentPairId = data.pair_id;
      currentA = data.a_text || "";
      currentB = data.b_text || "";
      currentADiffHtml = data.a_diff_html || "";
      currentBDiffHtml = data.b_diff_html || "";
      renderDraft(data.context_draft || "");
      refreshCandidates();
      resetCandidateScroll();
    }

    async function submit(choice) {
      if (!currentPairId) return;
      setBusy(true);
      errEl.textContent = "";
      try {
        const res = await fetch("/api/judge", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            pair_id: currentPairId,
            choice,
            comment: commentEl.value || "",
            a_broken: document.getElementById("flag-a").checked,
            b_broken: document.getElementById("flag-b").checked,
            a_noedit: document.getElementById("noedit-a").checked,
            b_noedit: document.getElementById("noedit-b").checked,
          }),
        });
        if (!res.ok) {
          const t = await res.text();
          throw new Error(t || res.statusText);
        }
        await loadNext();
      } catch (e) {
        errEl.textContent = String(e.message || e);
      } finally {
        setBusy(false);
      }
    }

    function setBusy(busy) {
      for (const id of ["btn-a", "btn-b", "btn-tie"]) {
        document.getElementById(id).disabled = busy;
      }
    }

    document.getElementById("btn-a").onclick = () => submit("a");
    document.getElementById("btn-b").onclick = () => submit("b");
    document.getElementById("btn-tie").onclick = () => submit("tie");

    for (const toggle of document.querySelectorAll(".view-toggle")) {
      const side = toggle.dataset.side;
      for (const btn of toggle.querySelectorAll("button")) {
        btn.onclick = () => setViewMode(side, btn.dataset.mode);
      }
    }

    for (const el of syncPanels) {
      el.addEventListener("scroll", () => syncScrollFrom(el), { passive: true });
    }

    loadNext().catch((e) => {
      errEl.textContent = String(e.message || e);
    });
  </script>
</body>
</html>
