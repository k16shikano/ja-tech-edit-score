<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>編集 SFT データ確認</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --panel: #fffdf8;
      --ink: #1c1a16;
      --muted: #6b655c;
      --line: #d9d2c5;
      --keep: #2f6b3a;
      --exclude: #8b2e2e;
      --pending: #7a5b1e;
      --accent: #2a4a6b;
      --focus: #c4d4e8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
      padding: 0.65rem 1rem;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    header h1 {
      font-size: 1rem;
      margin: 0;
      font-weight: 650;
    }
    .warn {
      color: var(--exclude);
      font-size: 0.8rem;
    }
    .counts {
      font-size: 0.8rem;
      color: var(--muted);
      margin-left: auto;
    }
    .layout {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(260px, 320px) 1fr;
      min-height: 0;
    }
    .sidebar {
      border-right: 1px solid var(--line);
      background: var(--panel);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .filters {
      padding: 0.75rem;
      display: grid;
      gap: 0.4rem;
      border-bottom: 1px solid var(--line);
    }
    .filters label {
      font-size: 0.72rem;
      color: var(--muted);
      display: grid;
      gap: 0.15rem;
    }
    .pager {
      display: flex;
      gap: 0.35rem;
      align-items: center;
      font-size: 0.72rem;
      color: var(--muted);
    }
    .pager button.action {
      padding: 0.25rem 0.45rem;
      font-size: 0.72rem;
    }
    .pager span { flex: 1; text-align: center; }
    select, input, button, textarea {
      font: inherit;
    }
    select, input[type="search"] {
      width: 100%;
      padding: 0.35rem 0.45rem;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
    }
    .list {
      overflow: auto;
      flex: 1;
    }
    .item {
      width: 100%;
      text-align: left;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      padding: 0.55rem 0.75rem;
      cursor: pointer;
    }
    .item:hover { background: #f0ebe1; }
    .item.active { background: var(--focus); }
    .item .row1 {
      display: flex;
      gap: 0.4rem;
      align-items: baseline;
      font-size: 0.72rem;
      color: var(--muted);
    }
    .item .preview {
      margin-top: 0.2rem;
      font-size: 0.82rem;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .badge {
      font-size: 0.68rem;
      padding: 0.05rem 0.35rem;
      border-radius: 3px;
      border: 1px solid currentColor;
    }
    .badge.keep { color: var(--keep); }
    .badge.exclude { color: var(--exclude); }
    .badge.pending { color: var(--pending); }
    .main {
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      padding: 0.65rem 1rem;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    .toolbar .meta {
      font-size: 0.78rem;
      color: var(--muted);
      flex: 1;
      min-width: 12rem;
      word-break: break-all;
    }
    button.action {
      padding: 0.4rem 0.75rem;
      border-radius: 4px;
      border: 1px solid var(--line);
      background: #fff;
      cursor: pointer;
    }
    button.action:hover { background: #f0ebe1; }
    button.action.keep { border-color: var(--keep); color: var(--keep); }
    button.action.exclude { border-color: var(--exclude); color: var(--exclude); }
    button.action.primary {
      border-color: var(--accent);
      color: var(--accent);
    }
    .editors {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      min-height: 0;
    }
    .col {
      display: flex;
      flex-direction: column;
      min-height: 0;
      border-right: 1px solid var(--line);
      padding: 0.75rem;
    }
    .col:last-child { border-right: 0; }
    .col h2 {
      margin: 0 0 0.4rem;
      font-size: 0.85rem;
      font-weight: 650;
    }
    .col textarea {
      flex: 1;
      width: 100%;
      resize: none;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 0.6rem;
      line-height: 1.55;
      background: #fff;
      white-space: pre-wrap;
    }
    .note-row {
      padding: 0.5rem 1rem 0.85rem;
      border-top: 1px solid var(--line);
      background: var(--panel);
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.5rem;
      align-items: center;
    }
    .note-row input {
      padding: 0.35rem 0.5rem;
      border: 1px solid var(--line);
      border-radius: 4px;
    }
    .keys {
      font-size: 0.72rem;
      color: var(--muted);
      padding: 0 1rem 0.5rem;
      background: var(--panel);
    }
    .empty {
      padding: 2rem;
      color: var(--muted);
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { max-height: 35vh; }
      .editors { grid-template-columns: 1fr; }
      .col { border-right: 0; border-bottom: 1px solid var(--line); min-height: 220px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>編集 SFT データ確認</h1>
    <span class="warn" id="warn"></span>
    <span class="counts" id="counts"></span>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <div class="filters">
        <label>split
          <select id="f-split">
            <option value="">すべて</option>
            <option value="train">train</option>
            <option value="heldout">heldout</option>
          </select>
        </label>
        <label>project
          <select id="f-project"><option value="">すべて</option></select>
        </label>
        <label>status
          <select id="f-status">
            <option value="">すべて</option>
            <option value="pending">pending</option>
            <option value="keep">keep</option>
            <option value="exclude">exclude</option>
          </select>
        </label>
        <label>検索
          <input type="search" id="f-q" placeholder="本文または id" />
        </label>
        <div class="pager" id="pager">
          <button class="action" id="btn-page-prev" type="button">↑ 前頁</button>
          <span id="page-label">—</span>
          <button class="action" id="btn-page-next" type="button">次頁 ↓</button>
        </div>
      </div>
      <div class="list" id="list"></div>
    </aside>
    <section class="main">
      <div class="toolbar">
        <div class="meta" id="meta">左の一覧から選ぶ</div>
        <button class="action" id="btn-prev" type="button">← 前</button>
        <button class="action" id="btn-next" type="button">次 →</button>
        <button class="action keep" id="btn-keep" type="button">採用 (Enter)</button>
        <button class="action exclude" id="btn-exclude" type="button">除外 (X)</button>
        <button class="action" id="btn-pending" type="button">未判定</button>
        <button class="action primary" id="btn-export" type="button">reviewed を書き出す</button>
      </div>
      <div class="editors" id="editors" hidden>
        <div class="col">
          <h2>下書き（draft）</h2>
          <textarea id="draft" spellcheck="false"></textarea>
        </div>
        <div class="col">
          <h2>推敲（revised）</h2>
          <textarea id="revised" spellcheck="false"></textarea>
        </div>
      </div>
      <div class="empty" id="empty">ペアを選択してください。</div>
      <div class="note-row" id="note-row" hidden>
        <label for="note">メモ</label>
        <input id="note" type="text" placeholder="任意" />
      </div>
      <div class="keys">
        ショートカット: J/↓ 次 · K/↑ 前 · Enter 採用 · X 除外 · / 検索へ
        （テキストエリア内では無効）
      </div>
    </section>
  </div>
  <script>
    const PAGE_SIZE = 100;
    const state = {
      currentId: null,
      filterIds: [],
      pageOffset: 0,
      filterTotal: 0,
      filterPrevId: null,
      filterNextId: null,
      dirty: false,
    };

    const $ = (id) => document.getElementById(id);

    async function api(path, opts) {
      const res = await fetch(path, opts);
      if (!res.ok) {
        const t = await res.text();
        throw new Error(t || res.statusText);
      }
      return res.json();
    }

    function filterParams() {
      return {
        split: $("f-split").value,
        project_id: $("f-project").value,
        status: $("f-status").value,
        q: $("f-q").value,
      };
    }

    function fmtSim(v) {
      if (v == null) return "—";
      return Number(v).toFixed(2);
    }

    async function refreshMeta() {
      const m = await api("/api/meta");
      $("warn").textContent = m.warning;
      const c = m.counts;
      $("counts").textContent =
        `全 ${c.total} · train ${c.train} · heldout ${c.heldout} · ` +
        `pending ${c.pending} · keep ${c.keep} · exclude ${c.exclude}`;
      const sel = $("f-project");
      const cur = sel.value;
      sel.innerHTML = '<option value="">すべて</option>';
      for (const p of m.projects) {
        const o = document.createElement("option");
        o.value = p;
        o.textContent = p;
        sel.appendChild(o);
      }
      sel.value = cur;
    }

    async function refreshFilterIds() {
      const params = new URLSearchParams(filterParams());
      let data;
      try {
        data = await api("/api/item-ids?" + params);
      } catch (e) {
        const msg = String(e.message || e);
        if (msg.includes("Not Found") || msg.includes("404")) {
          throw new Error(
            "API /api/item-ids がありません。レビューサーバを再起動してください（make edit-sft-review-hunk）。"
          );
        }
        throw e;
      }
      state.filterIds = data.ids;
      state.filterTotal = data.total;
    }

    function pageContaining(id) {
      const i = state.filterIds.indexOf(id);
      if (i < 0) return state.pageOffset;
      return Math.floor(i / PAGE_SIZE) * PAGE_SIZE;
    }

    function updatePager() {
      const total = state.filterTotal;
      const start = total === 0 ? 0 : state.pageOffset + 1;
      const end = Math.min(state.pageOffset + PAGE_SIZE, total);
      $("page-label").textContent =
        total === 0 ? "0 件" : `${start}–${end} / ${total}`;
      $("btn-page-prev").disabled = state.pageOffset <= 0;
      $("btn-page-next").disabled = state.pageOffset + PAGE_SIZE >= total;
    }

    async function refreshList({ keepId, resetPage } = {}) {
      await refreshFilterIds();
      if (resetPage) state.pageOffset = 0;
      if (keepId && state.filterIds.includes(keepId)) {
        state.pageOffset = pageContaining(keepId);
      }
      if (state.pageOffset >= state.filterTotal && state.filterTotal > 0) {
        state.pageOffset = pageContaining(state.filterIds[state.filterTotal - 1]);
      }
      const params = new URLSearchParams({
        ...filterParams(),
        offset: String(state.pageOffset),
        limit: String(PAGE_SIZE),
      });
      const data = await api("/api/items?" + params);
      const list = $("list");
      list.innerHTML = "";
      for (const it of data.items) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "item" + (it.id === state.currentId ? " active" : "");
        btn.dataset.id = it.id;
        btn.innerHTML =
          `<div class="row1"><span class="badge ${it.status}">${it.status}</span>` +
          `<span>${it.split}</span><span>${it.project_id || "?"}</span>` +
          `<span>sim ${fmtSim(it.char_similarity)}</span></div>` +
          `<div class="preview">${escapeHtml(it.preview || it.id)}</div>`;
        btn.addEventListener("click", () => openItem(it.id));
        list.appendChild(btn);
      }
      updatePager();
      if (keepId && state.filterIds.includes(keepId)) {
        /* stay on keepId; caller may openItem */
      } else if (!state.currentId && state.filterIds[0]) {
        await openItem(state.filterIds[0]);
      } else if (
        state.currentId &&
        state.filterIds.length &&
        !state.filterIds.includes(state.currentId)
      ) {
        await openItem(state.filterIds[0], { force: true });
      }
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    async function openItem(id, { force } = {}) {
      if (!force && state.dirty && state.currentId && state.currentId !== id) {
        if (!confirm("未保存の変更があります。捨てて移動しますか？")) return;
      }
      const params = new URLSearchParams(filterParams());
      const item = await api(
        "/api/item/" + encodeURIComponent(id) + "?" + params
      );
      state.currentId = id;
      state.dirty = false;
      state.filterPrevId = item.filter_prev_id;
      state.filterNextId = item.filter_next_id;
      // 一覧に無い id でも前/次できるよう、ページを合わせる
      if (state.filterIds.includes(id)) {
        const need = pageContaining(id);
        if (need !== state.pageOffset) {
          state.pageOffset = need;
          await refreshList({ keepId: id });
        }
      }
      $("editors").hidden = false;
      $("empty").hidden = true;
      $("note-row").hidden = false;
      $("draft").value = item.draft;
      $("revised").value = item.revised;
      $("note").value = item.note || "";
      const fpos =
        item.filter_index >= 0
          ? `${item.filter_index + 1}/${item.filter_total}`
          : `—/${item.filter_total}`;
      $("meta").textContent =
        `[フィルタ ${fpos} · 全体 ${item.index + 1}] ${item.id} · ${item.split} · ${item.project_id} · ` +
        `source=${item.source} · sim=${fmtSim(item.char_similarity)} · ` +
        `jaccard=${fmtSim(item.bigram_jaccard)} · ratio=${fmtSim(item.length_ratio)} · ` +
        `${item.draft_chars ?? item.draft.length}字 / ${item.revised_chars ?? item.revised.length}字` +
        (item.draft_paragraphs != null ? ` · 段落 ${item.draft_paragraphs}→${item.revised_paragraphs}` : "") +
        (item.edited ? " · 本文編集あり" : "") +
        ` · status=${item.status}`;
      document.querySelectorAll(".item").forEach((el) => {
        el.classList.toggle("active", el.dataset.id === id);
      });
      const active = document.querySelector(`.item[data-id="${CSS.escape(id)}"]`);
      if (active) active.scrollIntoView({ block: "nearest" });
      $("btn-prev").disabled = !state.filterPrevId;
      $("btn-next").disabled = !state.filterNextId;
      // 項目切替時は先頭へ揃え、同期ずれを残さない
      $("draft").scrollTop = 0;
      $("revised").scrollTop = 0;
    }

    // 下書き / 推敲のスクロールを割合で同期
    let syncingScroll = false;
    function syncScroll(from, to) {
      if (syncingScroll) return;
      const fromMax = from.scrollHeight - from.clientHeight;
      const toMax = to.scrollHeight - to.clientHeight;
      syncingScroll = true;
      try {
        if (fromMax <= 0 || toMax <= 0) {
          to.scrollTop = 0;
        } else {
          to.scrollTop = (from.scrollTop / fromMax) * toMax;
        }
      } finally {
        // rAF 後に解除（相手の scroll イベントが回ってから）
        requestAnimationFrame(() => {
          syncingScroll = false;
        });
      }
    }
    $("draft").addEventListener("scroll", () => syncScroll($("draft"), $("revised")));
    $("revised").addEventListener("scroll", () => syncScroll($("revised"), $("draft")));

    async function save(status) {
      if (!state.currentId) return;
      const cur = state.currentId;
      const prevNav = state.filterPrevId;
      const nextNav = state.filterNextId;
      await api("/api/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          id: cur,
          status,
          draft: $("draft").value,
          revised: $("revised").value,
          note: $("note").value,
        }),
      });
      state.dirty = false;
      await refreshMeta();
      let nextId = cur;
      if (status === "exclude" || status === "keep") {
        // フィルタから外れる場合があるので、保存前に覚えた前後へ
        nextId = nextNav || prevNav || cur;
      }
      await refreshList({ keepId: nextId });
      if (state.filterIds.includes(nextId)) {
        await openItem(nextId, { force: true });
      } else if (state.filterIds[0]) {
        await openItem(state.filterIds[0], { force: true });
      }
    }

    function markDirty() {
      state.dirty = true;
    }

    function move(delta) {
      if (!state.currentId) return;
      // フィルタ全件の列で動く（左に表示中の頁だけに閉じない）
      const i = state.filterIds.indexOf(state.currentId);
      if (i >= 0) {
        const n = state.filterIds[i + delta];
        if (n) openItem(n);
        return;
      }
      const n = delta < 0 ? state.filterPrevId : state.filterNextId;
      if (n) openItem(n);
    }

    $("draft").addEventListener("input", markDirty);
    $("revised").addEventListener("input", markDirty);
    $("note").addEventListener("input", markDirty);
    ["f-split", "f-project", "f-status"].forEach((id) => {
      $(id).addEventListener("change", () => refreshList({ resetPage: true }));
    });
    let qTimer = null;
    $("f-q").addEventListener("input", () => {
      clearTimeout(qTimer);
      qTimer = setTimeout(() => refreshList({ resetPage: true }), 200);
    });
    $("btn-page-prev").addEventListener("click", async () => {
      state.pageOffset = Math.max(0, state.pageOffset - PAGE_SIZE);
      await refreshList();
    });
    $("btn-page-next").addEventListener("click", async () => {
      state.pageOffset = state.pageOffset + PAGE_SIZE;
      await refreshList();
    });
    $("btn-prev").addEventListener("click", () => move(-1));
    $("btn-next").addEventListener("click", () => move(1));
    $("btn-keep").addEventListener("click", () => save("keep"));
    $("btn-exclude").addEventListener("click", () => save("exclude"));
    $("btn-pending").addEventListener("click", () => save("pending"));
    $("btn-export").addEventListener("click", async () => {
      const r = await api("/api/export", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ include_pending_as_keep: false }),
      });
      alert(
        `書き出し完了\ntrain ${r.written.train}\nheldout ${r.written.heldout}\n` +
        `excluded ${r.written.excluded}\npending_skipped ${r.written.pending_skipped || 0}\n\n` +
        `${r.paths.train}\n${r.paths.heldout}`
      );
    });

    document.addEventListener("keydown", (ev) => {
      const tag = (ev.target && ev.target.tagName) || "";
      const inField = tag === "TEXTAREA" || tag === "INPUT" || tag === "SELECT";
      if (ev.key === "/" && !inField) {
        ev.preventDefault();
        $("f-q").focus();
        return;
      }
      if (inField) return;
      if (ev.key === "j" || ev.key === "ArrowDown") {
        ev.preventDefault();
        move(1);
      } else if (ev.key === "k" || ev.key === "ArrowUp") {
        ev.preventDefault();
        move(-1);
      } else if (ev.key === "Enter") {
        ev.preventDefault();
        save("keep");
      } else if (ev.key === "x" || ev.key === "X") {
        ev.preventDefault();
        save("exclude");
      }
    });

    (async () => {
      await refreshMeta();
      await refreshList({ resetPage: true });
    })().catch((e) => {
      $("empty").textContent = "読み込み失敗: " + e.message;
    });
  </script>
</body>
</html>
