# fly.toml app configuration file generated for ja-tech-edit-score
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ja-tech-edit-score'
primary_region = 'nrt'

[build]
  dockerfile = 'Dockerfile.serve'

[env]
  RATE_LIMIT_PER_IP = '10'
  RATE_LIMIT_WINDOW_SECONDS = '86400'
  MAX_TEXT_CHARS = '8000'
  MIN_MARGIN = '3.4'
  GATE_MIN_MARGIN = '0.0'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # コールドスタートでモデル読込に数十秒かかる。常時1台残すと初回502を避けやすい。
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 10
    soft_limit = 5

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '180s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '2gb'
  cpus = 2
